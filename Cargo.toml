cargo-features = ["codegen-backend"]

[workspace]
members = ["exchange_interactions", "exchange_interactions_*"]
resolver = "3"

[workspace.lints.rust]
unused_features = "allow"

[workspace.lints.clippy]
float_cmp = "allow" # is bad for `==` direct comparisons, but `<` and `>` should be allowed
len_zero = "allow" # `.empty()` is O(1) but on &str only
redundant_field_names = "allow" # `derive_new` writes `field: field` on our own field spans, so every `#[derive(new)]` trips it
undocumented_unsafe_blocks = "warn"
tabs_in_doc_comments = "allow"

# Questionable
get_first = "allow" # const fn, so actually more performant
get_last_with_len = "allow"

# avoid setting patch versions, - remember that we are a lib. If behavior didn't change, we should not bump the dep version.
[workspace.dependencies]
ahash = { version = "^0.8", features = ["serde"] }
arc-swap = "^1"
arrayvec = "^0.7"
async-trait = "^0.1"
base64 = "^0.23"
cfg-if = "^1.0"
dashmap = "^6"
derive-new = "^0.7"
derive_more = { version = "^2.1", features = ["deref", "deref_mut"] }
eyre = "^0.6"
flate2 = "^1"
futures-util = "^0.3"
hex = "^0.4"
hmac = "^0.13"
jiff = "^0.2"
miette = { version = "^7.6", features = ["fancy"] }
netwatcher = "^0.7"
nonzero_ext = "^0.3"
rand = "^0.10"
reqwest = { version = "^0.13", features = ["blocking", "json", "query"] }
rstest = "^0.26"
secrecy = "^0.10"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
serde_plain = "^1.0" #TEST
serde_urlencoded = "^0.7"
serde_with = "^3.21"
sha2 = "^0.11"
smart-default = "^0.7"
thiserror = "^2.0"
tokio = { version = "^1.53", features = ["sync", "macros", "io-util", "rt", "rt-multi-thread", "time"] } # enable only features that play with wasm.
tracing = "^0.1.44"
trading_data_core.version = "0.3"
url = "^2.5.8"
ustr = "^1"
uuid = { version = "^1.24", features = ["v7"] }
v_utils = { version = "^2.16", features = ["xdg"] }
zip = "^8"
#dynosaur = "^0.2.0"

#[dev-dependencies]
bytes = "1.12"
color-eyre = "0.6"
criterion = { version = "0.8", default-features = false }
enum_dispatch = "0.3"
insta = "1.48"
rust_decimal = "1.42"
strum = { version = "^0.28", features = ["derive"] }
tokio-tungstenite = "0.30"

exchange_interactions_adapters = { version = "0.19.2", path = "exchange_interactions_adapters" }
exchange_interactions_api_generics = { version = "0.21.2", path = "exchange_interactions_api_generics" }
exchange_interactions_methods = { version = "0.2.2", path = "exchange_interactions_methods", default-features = false }

[patch.crates-io]
trading_data_core = { path = "../trading_data/trading_data_core" }
v_utils = { path = "../../v_utils/v_utils" }
