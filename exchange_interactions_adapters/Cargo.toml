cargo-features = ["codegen-backend"]

[package]
name = "exchange_interactions_adapters"
version = "0.19.2"
edition = "2024"

authors = ["negi-grass", "valeratrades"]
categories = ["api-bindings", "asynchronous"]
description = "Implementations of HTTP/HTTPS/WebSocket API methods for some crypto exchanges, using [crypto-botters](<https://github.com/negi-grass/crypto-botters>) framework"
documentation = "https://docs.rs/exchange_interactions_adapters"
homepage = "https://github.com/EV-invest/exchange_interactions"
keywords = ["client", "websocket", "asynchronous"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/EV-invest/exchange_interactions/tree/main/exchange_interactions_adapters"

[package.metadata.cargo-machete]
ignored = ["derive-new", "thiserror"]

[package.metadata.docs.rs]
all-features = false
features = ["binance", "bybit", "mexc"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["native-tls"]

full = ["binance", "bitflyer", "bybit", "coincheck", "kucoin", "mexc"]
binance = ["dep:rand"]
bitflyer = ["dep:rand"]
bybit = ["dep:rand"]
coincheck = []
kucoin = []
mexc = []

native-tls = ["exchange_interactions_api_generics/native-tls"]
native-tls-vendored = ["exchange_interactions_api_generics/native-tls-vendored"]
rustls-tls-native-roots = ["exchange_interactions_api_generics/rustls-tls-native-roots"]
rustls-tls-webpki-roots = ["exchange_interactions_api_generics/rustls-tls-webpki-roots"]

[dependencies]
ahash = { workspace = true, features = ["serde"] }
base64.workspace = true
derive-new.workspace = true
derive_more.workspace = true
exchange_interactions_api_generics.workspace = true
eyre.workspace = true
hex.workspace = true
hmac.workspace = true
jiff.workspace = true
rand = { workspace = true, optional = true }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
sha2.workspace = true
smart-default.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
ustr.workspace = true
v_utils.workspace = true

[dev-dependencies]
rust_decimal = { workspace = true, features = ["serde-with-str", "serde-with-float"] }
tokio.workspace = true

[lints]
workspace = true
